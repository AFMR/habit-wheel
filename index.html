<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Habit Wheel</title><style>
:root{font-family:ui-rounded,'Segoe UI',Arial,sans-serif;color:#614c72;background:#fbf7ff}*{box-sizing:border-box}body{margin:0;padding:22px}.wrap{max-width:900px;margin:auto;background:#fff;border:1px solid #eee2f4;border-radius:26px;box-shadow:0 10px 30px #aa87b51a;padding:24px}h1{font-size:27px;margin:0;color:#76568d}.sub{font-size:13px;color:#937fa0;margin:7px 0 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.month{display:flex;align-items:center;gap:8px}button{font:inherit;cursor:pointer;border:1px solid #e9daee;background:#f8effc;color:#725286;border-radius:12px;padding:9px 13px}button:hover{background:#eddef5}.content{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap}.wheel{width:min(100%,490px);height:auto;touch-action:manipulation}.segment{cursor:pointer;stroke:#fff;stroke-width:1.6;transition:opacity .12s}.segment:hover{opacity:.78}.side{min-width:220px;flex:1;max-width:270px}.habit{display:flex;justify-content:space-between;align-items:center;margin:12px 0;padding:12px;border-radius:14px;background:#faf6fc}.dot{width:13px;height:13px;border-radius:50%;display:inline-block;margin-right:9px}.label{font-weight:600}.count{font-size:13px;color:#8e7a9a}.hint{font-size:13px;line-height:1.6;color:#8e7a9a;margin-top:20px}.foot{font-size:11px;color:#9b8aa5;text-align:center;margin-top:18px}#dayInfo{font-size:13px;color:#7e688c;min-height:21px;text-align:center;margin:5px 0}#today{background:#f1e4f9}.small{font-size:12px}svg text{font-family:inherit;pointer-events:none}@media(max-width:550px){body{padding:7px}.wrap{padding:15px}.wheel{max-width:420px}.side{max-width:100%;width:100%}.habit{margin:7px 0}h1{font-size:23px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>🌸 My Habit Wheel</h1><p class="sub">Little moments, beautiful progress ✨</p></div><div class="month"><button id="prev" aria-label="Previous month">❮</button><strong id="monthLabel"></strong><button id="next" aria-label="Next month">❯</button></div></div><div class="content"><div style="flex:2;min-width:260px;max-width:490px"><svg id="wheel" class="wheel" viewBox="0 0 500 500" role="group" aria-label="Interactive monthly habit wheel"></svg><div id="dayInfo" aria-live="polite">Tap a segment to mark a day ♡</div></div><section class="side"><div id="stats"></div><p class="hint">💗 Tap any segment to mark it complete. Tap again to undo.<br>Each ring is one habit. Each slice is one day of the month.</p><button id="today">Jump to this month</button><p class="small" style="color:#a38bad">Saved automatically on this device.</p></section></div><p class="foot">Made for your gentle daily routines 🪻</p></main><script>
const habits=[{name:'Walk',icon:'🚶',color:'#b69be7',pale:'#eee8f8'},{name:'Self care',icon:'🩷',color:'#eea4c8',pale:'#fae7f1'},{name:'Meditate',icon:'🧘',color:'#9dc9c1',pale:'#e5f3ef'},{name:'Hot beverage',icon:'☕',color:'#e7b17e',pale:'#f8eada'}];const now=new Date();let year=now.getFullYear(),month=now.getMonth();const svg=document.getElementById('wheel');function key(h,d){return `my-habit-wheel-v1:${year}-${month+1}:${h}:${d}`};function saved(h,d){return localStorage.getItem(key(h,d))==='1'}function polar(cx,cy,r,a){let t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}function wedge(r1,r2,a1,a2){const p1=polar(250,250,r2,a1),p2=polar(250,250,r2,a2),p3=polar(250,250,r1,a2),p4=polar(250,250,r1,a1);return `M${p1.join(',')} A${r2},${r2} 0 0 1 ${p2.join(',')} L${p3.join(',')} A${r1},${r1} 0 0 0 ${p4.join(',')} Z`};function el(tag,attrs){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e}function render(){const days=new Date(year,month+1,0).getDate();document.getElementById('monthLabel').textContent=new Date(year,month,1).toLocaleString('en-US',{month:'long',year:'numeric'});svg.replaceChildren();const radii=[[162,205],[116,157],[70,111],[24,65]];habits.forEach((h,hi)=>{for(let d=1;d<=days;d++){let a1=(d-1)*360/days+0.4,a2=d*360/days-0.4;let seg=el('path',{d:wedge(...radii[hi],a1,a2),fill:saved(hi,d)?h.color:h.pale,class:'segment',tabindex:'0',role:'button','aria-label':`${h.name} day ${d}: ${saved(hi,d)?'complete':'incomplete'}`});seg.addEventListener('click',()=>toggle(hi,d));seg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(hi,d)}});seg.addEventListener('mouseenter',()=>info(hi,d));seg.addEventListener('focus',()=>info(hi,d));svg.append(seg)}});const center=el('circle',{cx:250,cy:250,r:20,fill:'#f8effb'});svg.append(center);let heart=el('text',{x:250,y:257,'text-anchor':'middle','font-size':'21',fill:'#ac80bb'});heart.textContent='♥';svg.append(heart);for(let d=1;d<=days;d++){let a=(d-.5)*360/days;let p=polar(250,250,222,a);let t=el('text',{x:p[0],y:p[1]+4,'text-anchor':'middle','font-size':'10',fill:'#927d9f'});t.textContent=d;svg.append(t)}const stats=document.getElementById('stats');stats.replaceChildren();habits.forEach((h,hi)=>{let done=Array.from({length:days},(_,i)=>saved(hi,i+1)).filter(Boolean).length;let box=document.createElement('div');box.className='habit';box.innerHTML=`<span class="label"><span class="dot" style="background:${h.color}"></span>${h.icon} ${h.name}</span><span class="count">${done}/${days}</span>`;stats.append(box)})}function info(h,d){document.getElementById('dayInfo').textContent=`${habits[h].icon} ${habits[h].name} · ${new Date(year,month,d).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${saved(h,d)?'Done ✓':'Not yet'}`}function toggle(h,d){localStorage.setItem(key(h,d),saved(h,d)?'0':'1');render();info(h,d)}document.getElementById('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};document.getElementById('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};document.getElementById('today').onclick=()=>{year=now.getFullYear();month=now.getMonth();render()};render();
</script></body></html>
