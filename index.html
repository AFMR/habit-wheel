<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Daily Habits</title>
<style>
:root{font-family:ui-rounded,"Segoe UI",Arial,sans-serif;color:#60496d;background:#fffafc}*{box-sizing:border-box}body{margin:0;padding:16px}.panel{max-width:1000px;margin:auto;border:1px solid #eee0ef;border-radius:22px;background:white;padding:22px;box-shadow:0 6px 24px #baa5c01b}h1{font-size:24px;margin:0 0 4px}.subtitle{font-size:13px;color:#927d9e;margin:0 0 20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px;flex-wrap:wrap}.month{font-weight:750;font-size:17px}.nav{border:1px solid #e6d9e9;background:#fff7fd;color:#674f7b;border-radius:10px;padding:8px 13px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(240px,1fr) minmax(300px,1.3fr);gap:22px;align-items:center}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.habit{border:1px solid #e9ddea;border-radius:16px;padding:14px;min-height:125px;cursor:pointer;text-align:left;color:#493d52;transition:transform .12s;position:relative}.habit:hover{transform:translateY(-2px)}.habit:focus-visible,.nav:focus-visible,.segment:focus-visible{outline:3px solid #9873c8;outline-offset:2px}.habit .emoji{font-size:23px}.habit .name{display:block;font-weight:750;margin-top:7px;font-size:14px}.habit .status{font-size:12px;display:block;margin-top:6px}.habit .check{position:absolute;right:13px;top:13px;font-size:20px}.wheel-wrap{text-align:center}.wheel{display:block;width:min(100%,420px);margin:auto}.segment{cursor:pointer;stroke:white;stroke-width:.8}.segment:hover{filter:brightness(.94)}.center-month{font-size:11px;font-weight:700;fill:#8e7d9c}.center-count{font-size:21px;font-weight:800;fill:#60496d}.day-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px}.selected{font-size:14px;font-weight:700}.footer{font-size:12px;color:#917d9d;text-align:center;margin-top:16px}.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:11px;margin-top:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.progress{margin-top:14px;background:#faf5fc;padding:10px;border-radius:12px;font-size:12px}.small{color:#8d789a}.hint{font-size:12px;color:#927d9e;text-align:center;margin:4px 0}@media(max-width:650px){body{padding:8px}.panel{padding:15px}.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.habit{min-height:104px;padding:11px}.wheel{max-width:390px}h1{font-size:21px}}
</style></head><body><main class="panel">
<h1>🌸 My Daily Habits</h1><p class="subtitle">Four little steps, one lovely month ✨</p>
<div class="toolbar"><button class="nav" id="prevMonth" aria-label="Previous month">❮</button><span class="month" id="monthLabel"></span><button class="nav" id="nextMonth" aria-label="Next month">❯</button></div>
<div class="layout"><section><div class="cards" id="cards"></div><div class="progress" id="progress"></div></section>
<section class="wheel-wrap"><svg class="wheel" id="wheel" viewBox="0 0 420 420" role="img" aria-label="Monthly habit wheel. Click a segment to select its day."></svg>
<div class="day-nav"><button class="nav" id="prevDay" aria-label="Previous day">❮</button><span class="selected" id="dayLabel"></span><button class="nav" id="nextDay" aria-label="Next day">❯</button></div><p class="hint">Tap a card to fill its ring for the selected day.</p>
<div class="legend" id="legend"></div></section></div>
<p class="footer">💜 Saved automatically in this browser · Data stays on this device</p>
</main><script>
const habits=[{id:"walk",name:"Walk",emoji:"🚶",color:"#bca4ed",bg:"#efe7ff"},{id:"self",name:"Self care",emoji:"🩷",color:"#efa4c6",bg:"#ffe5f0"},{id:"meditate",name:"Meditate",emoji:"🧘",color:"#91cfba",bg:"#e2f7ed"},{id:"beverage",name:"Hot beverage",emoji:"☕",color:"#eec47d",bg:"#fff1d5"}];
const now=new Date();let year=now.getFullYear(),month=now.getMonth(),day=now.getDate();const storageKey="afmr-habit-wheel-v2";let data={};try{data=JSON.parse(localStorage.getItem(storageKey)||"{}")||{}}catch(e){}
const $=id=>document.getElementById(id),daysInMonth=()=>new Date(year,month+1,0).getDate(),key=()=>`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`,isDone=id=>!!(data[key()]&&data[key()][id]);
function save(){try{localStorage.setItem(storageKey,JSON.stringify(data))}catch(e){alert("Browser storage is unavailable. Progress may not be saved.")}}
function toggle(id){const k=key();data[k]??={};data[k][id]=!data[k][id];save();render()}
function point(r,a){return [210+r*Math.cos(a),210+r*Math.sin(a)]}
function wedge(r0,r1,a,b){let p1=point(r1,a),p2=point(r1,b),p3=point(r0,b),p4=point(r0,a);return `M${p1} L${p2} A${r1} ${r1} 0 0 1 ${p3} L${p4} A${r0} ${r0} 0 0 0 ${p1} Z`}
function render(){let count=daysInMonth();if(day>count)day=count;let monthName=new Date(year,month,1).toLocaleDateString("en-US",{month:"long",year:"numeric"});$("monthLabel").textContent=monthName;$("dayLabel").textContent=new Date(year,month,day).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});$("cards").innerHTML="";let completed=0;
habits.forEach(h=>{if(isDone(h.id))completed++;let b=document.createElement("button");b.className="habit";b.style.background=h.bg;b.setAttribute("aria-pressed",String(isDone(h.id)));b.innerHTML=`<span class="emoji">${h.emoji}</span><span class="check">${isDone(h.id)?"✔":"○"}</span><span class="name">${h.name}</span><span class="status">${isDone(h.id)?"Completed ✓":"Tap to complete"}</span>`;b.onclick=()=>toggle(h.id);$("cards").appendChild(b)});
$("progress").innerHTML=`<strong>${completed} of 4</strong> habits completed for selected day <span class="small">· ${Math.round(completed/4*100)}%</span>`;
let svg=$("wheel");svg.replaceChildren();const NS="http://www.w3.org/2000/svg";
habits.forEach((h,i)=>{let outer=195-i*37,inner=outer-28;for(let d=1;d<=count;d++){let a=-Math.PI/2+(d-1)*Math.PI*2/count+.008,b=-Math.PI/2+d*Math.PI*2/count-.008,k=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;let done=!!data[k]?.[h.id];let path=document.createElementNS(NS,"path");path.setAttribute("d",wedge(inner,outer,a,b));path.setAttribute("fill",done?h.color:d===day?"#e5dbea":"#f1edf3");path.setAttribute("class","segment");path.setAttribute("aria-label",`${h.name}, day ${d}: ${done?"completed":"not completed"}`);path.setAttribute("tabindex","0");path.onclick=()=>{day=d;render()};path.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();day=d;render()}};svg.appendChild(path)}});
let t=document.createElementNS(NS,"text");t.setAttribute("x","210");t.setAttribute("y","205");t.setAttribute("text-anchor","middle");t.setAttribute("class","center-month");t.textContent=new Date(year,month,1).toLocaleDateString("en-US",{month:"short"}).toUpperCase();svg.appendChild(t);let n=document.createElementNS(NS,"text");n.setAttribute("x","210");n.setAttribute("y","230");n.setAttribute("text-anchor","middle");n.setAttribute("class","center-count");n.textContent=year;svg.appendChild(n);
$("legend").innerHTML=habits.map(h=>`<span><i class="dot" style="background:${h.color}"></i>${h.name}</span>`).join("");
}
$("prevDay").onclick=()=>{if(day>1)day--;else{month--;if(month<0){month=11;year--}day=daysInMonth()}render()};$("nextDay").onclick=()=>{if(day<daysInMonth())day++;else{month++;if(month>11){month=0;year++}day=1}render()};
$("prevMonth").onclick=()=>{month--;if(month<0){month=11;year--}day=Math.min(day,daysInMonth());render()};$("nextMonth").onclick=()=>{month++;if(month>11){month=0;year++}day=Math.min(day,daysInMonth());render()};render();
</script></body></html>
