<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Daily Habits & Mood</title><style>
:root{font-family:ui-rounded,'Segoe UI',Arial,sans-serif;color:#604b70;background:transparent}*{box-sizing:border-box}body{margin:0;padding:5px}.app{background:#fffafd;border:1px solid #eee2ef;border-radius:15px;padding:12px;max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}h1{font-size:16px;margin:0;color:#77538b}.nav{display:flex;align-items:center;gap:5px}.nav button,.day-control button{border:1px solid #e8d7eb;background:white;color:#80618e;border-radius:7px;padding:4px 8px;cursor:pointer;font-size:12px}.month{font-size:13px;font-weight:700;min-width:115px;text-align:center}.help{font-size:11px;color:#a18fa9;margin:0 0 10px}.table-scroll{overflow-x:auto;padding-bottom:4px}.table{display:grid;grid-template-columns:116px repeat(var(--days),minmax(17px,1fr));column-gap:3px;row-gap:7px;min-width:650px;align-items:center}.day-head{text-align:center;font-size:9px;color:#9d87a7;cursor:pointer;border-radius:4px;padding:3px 0}.day-head.active{background:#e8d8f6;color:#6c4587;font-weight:800}.row-label{border:0;border-radius:7px;padding:7px 5px;background:var(--bg);color:#644e6c;font-size:11px;font-weight:650;text-align:left;white-space:nowrap}.square{aspect-ratio:1;min-height:17px;min-width:17px;border:1px solid #e5dbe9;border-radius:4px;background:#f5f1f6;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-size:10px}.square.done{background:var(--fill);border-color:var(--fill);color:white;font-weight:bold}.square.mood{background:var(--fill);border-color:var(--fill)}.square.today{outline:2px solid #9a6dc1;outline-offset:1px}.square:focus-visible,button:focus-visible{outline:2px solid #8a62a9;outline-offset:2px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid #f0e6f2}.day-control{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:650}.moods{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.moods button{border:2px solid transparent;background:#f7f2f8;border-radius:8px;padding:4px 6px;font-size:16px;cursor:pointer}.moods button.chosen{border-color:#9a6dc1;background:#f1e5fb}.small{font-size:10px;color:#95829e}.clear{border:1px solid #e8d7eb;background:white;color:#80618e;border-radius:7px;padding:5px 7px;cursor:pointer;font-size:10px}.legend{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.swatch{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:middle;margin-right:3px}@media(max-width:650px){.app{padding:9px}.table{grid-template-columns:99px repeat(var(--days),18px);min-width:max-content}.row-label{font-size:10px}h1{font-size:14px}}
</style></head><body><main class="app"><header><h1>🌸 My Daily Habits & Mood</h1><div class="nav"><button id="pm" aria-label="Previous month">‹</button><span class="month" id="month"></span><button id="nm" aria-label="Next month">›</button></div></header><p class="help">Tap a square to complete a habit · Select a day, then choose its mood below.</p><div class="table-scroll"><div class="table" id="table" role="group" aria-label="Monthly habit and mood calendar"></div></div><div class="controls"><div class="day-control"><button id="pd" aria-label="Previous day">‹</button><span id="selectedDay"></span><button id="nd" aria-label="Next day">›</button></div><div class="moods" id="moods"></div><button class="clear" id="clear">Clear mood</button><span class="small">Saved on this device</span></div></main><script>
const habits=[{id:'walk',name:'🚶 Walk',color:'#baa2eb',bg:'#efe8fc'},{id:'self',name:'🩷 Self care',color:'#eeabc9',bg:'#ffe7f1'},{id:'meditate',name:'🧘 Meditate',color:'#9ed3ba',bg:'#e3f5ed'},{id:'beverage',name:'☕ Hot beverage',color:'#ebc88e',bg:'#fff0d9'}];
const moods=[{id:0,emoji:'😐',name:'Neutral',color:'#aeb2ba'},{id:1,emoji:'😢',name:'Sad',color:'#8db8ed'},{id:2,emoji:'🥰',name:'Happy',color:'#f3a5c7'},{id:3,emoji:'😣',name:'Anxious',color:'#b7a0e7'},{id:4,emoji:'😊',name:'Great',color:'#f5d47c'}];
const $=id=>document.getElementById(id);const now=new Date();let year=now.getFullYear(),month=now.getMonth(),day=now.getDate();let data={};try{data=JSON.parse(localStorage.getItem('afmr-habit-wheel-v2')||'{}')||{}}catch(e){};
const count=()=>new Date(year,month+1,0).getDate();const key=d=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const get=d=>data[key(d)]||{};
function save(){try{localStorage.setItem('afmr-habit-wheel-v2',JSON.stringify(data))}catch(e){alert('Browser storage unavailable; changes may not persist.')}}
function update(d,id,value){const k=key(d);data[k]??={};data[k][id]=value;save();render()}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function render(){day=Math.min(day,count());$('month').textContent=new Date(year,month,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});$('selectedDay').textContent=new Date(year,month,day).toLocaleDateString('en-US',{month:'short',day:'numeric'});const grid=$('table');grid.replaceChildren();grid.style.setProperty('--days',count());grid.appendChild(el('span'));
for(let d=1;d<=count();d++){let b=el('button','day-head'+(d===day?' active':''),String(d));b.type='button';b.title='Select day '+d;b.onclick=()=>{day=d;render()};grid.appendChild(b)}
for(const h of habits){let label=el('div','row-label',h.name);label.style.setProperty('--bg',h.bg);grid.appendChild(label);for(let d=1;d<=count();d++){let yes=!!get(d)[h.id];let b=el('button','square'+(yes?' done':'')+(d===day?' today':''),yes?'✓':'');b.style.setProperty('--fill',h.color);b.type='button';b.setAttribute('aria-label',`${h.name} day ${d}: ${yes?'completed':'not completed'}`);b.setAttribute('aria-pressed',String(yes));b.onclick=()=>{day=d;update(d,h.id,!yes)};grid.appendChild(b)}}
let label=el('div','row-label','💗 Mood');label.style.setProperty('--bg','#eee7f8');grid.appendChild(label);for(let d=1;d<=count();d++){let m=moods.find(x=>x.id===get(d).mood);let b=el('button','square mood'+(d===day?' today':''),m?'':'');b.type='button';b.style.setProperty('--fill',m?m.color:'#f5f1f6');b.setAttribute('aria-label',`Mood day ${d}: ${m?m.name:'not recorded'}`);b.onclick=()=>{day=d;render()};grid.appendChild(b)}
const moodbar=$('moods');moodbar.replaceChildren();for(let m of moods){let b=el('button',get(day).mood===m.id?'chosen':'',m.emoji);b.type='button';b.title=m.name;b.setAttribute('aria-label',m.name);b.setAttribute('aria-pressed',String(get(day).mood===m.id));b.onclick=()=>update(day,'mood',m.id);moodbar.appendChild(b)} }
function moveMonth(n){month+=n;if(month<0){month=11;year--}if(month>11){month=0;year++}day=Math.min(day,count());render()}
function moveDay(n){day+=n;if(day<1){moveMonth(-1);day=count()}else if(day>count()){moveMonth(1);day=1}render()}
$('pm').onclick=()=>moveMonth(-1);$('nm').onclick=()=>moveMonth(1);$('pd').onclick=()=>moveDay(-1);$('nd').onclick=()=>moveDay(1);$('clear').onclick=()=>update(day,'mood',null);render();
</script></body></html>
